# Your ten LogQL expressions. Replace each `expr: TODO` with ONE metric query (a query that returns numbers, such as count_over_time(...)).
#
# "time" is the moment at which the query is evaluated:  "end" = just after the last log line,  "start+55m" = 55 minutes after the first log line.
# (.lab/.window.json has both as unix times.) A range like [2h] looks back from that moment, so [2h] at "end" covers the whole data set.
# The checker evaluates your expression at that moment and compares the RESULT with the right answer, so any correct way of asking is fine.
#
# The logs: label app="beanie" and service in gateway, menu, orders, payments, notifications.
# gateway, menu, orders and payments log JSON (fields: ts, level, service, msg, request_id, trace_id, duration_ms, customer, order_id, route, status).
# notifications logs plain text:  "sms sent country=PT order=ord_1a2b3c".
questions:
